<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3182f6"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="진급시험"><style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>2급 진급시험 예상 기출문제</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 모바일 금융앱·메신저 느낌의 단일 컬럼. 회색 바탕 위 큰 라운드 카드, 굵은 큰 제목, 하단 고정 큰 버튼, 해설은 말풍선 */
:root{
  --bg:#f2f4f6; --card:#ffffff; --ink:#191f28; --ink2:#4e5968; --muted:#8b95a1; --line:#e5e8eb; --soft:#f2f4f6;
  --accent:#3182f6; --accent-press:#1b64da; --accent-soft:#e8f3ff; --on-accent:#ffffff;
  --ok:#0ca678; --ok-soft:#e6f8f1; --bad:#f04452; --bad-soft:#ffeeee; --warm:#fee500; --warm-ink:#3c1e1e;
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; --num:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101012; --card:#1d1d21; --ink:#f2f4f6; --ink2:#c3c8cf; --muted:#8b95a1; --line:#2c2d33; --soft:#26272c;
  --accent:#4593fc; --accent-press:#6aa9ff; --accent-soft:#1b2a44; --on-accent:#ffffff;
  --ok:#34d399; --ok-soft:#14302a; --bad:#ff6b77; --bad-soft:#3a1d22; --warm:#fee500; --warm-ink:#3c1e1e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101012; --card:#1d1d21; --ink:#f2f4f6; --ink2:#c3c8cf; --muted:#8b95a1; --line:#2c2d33; --soft:#26272c;
  --accent:#4593fc; --accent-press:#6aa9ff; --accent-soft:#1b2a44; --on-accent:#ffffff;
  --ok:#34d399; --ok-soft:#14302a; --bad:#ff6b77; --bad-soft:#3a1d22; --warm:#fee500; --warm-ink:#3c1e1e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none}
button:active:not(:disabled){transform:scale(.98)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#app{padding-block:24px 128px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 홈 */
.title{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.35;margin:8px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.hero{background:var(--card);border-radius:24px;padding:22px 20px;display:grid;gap:16px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero .dd{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
.hero .dd small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.hero .rate{text-align:right;font-size:13px;color:var(--muted);line-height:1.7}
.hero .rate b{color:var(--ink);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{height:10px;background:var(--soft);border-radius:5px;display:flex;overflow:hidden}
.pbar i{height:100%}.pbar .o{background:var(--ok)}.pbar .x{background:var(--bad)}
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;padding:17px;transition:background .15s}
.cta:hover:not(:disabled){background:var(--accent-press)}
.cta:disabled{opacity:.35;cursor:default}
.cta.ghost{background:var(--soft);color:var(--ink2)}
.cta.ghost:hover:not(:disabled){background:var(--line)}
.cta.warm{background:var(--warm);color:var(--warm-ink)}
.label{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:34px 2px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.label small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.papers{display:grid;gap:10px}
.paper{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:20px;padding:18px;text-align:left;width:100%}
.paper .ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.paper .ic.r{background:var(--warm);color:var(--warm-ink)}
.paper .tx{flex:1;min-width:0}
.paper b{display:block;font-size:16.5px;font-weight:700}
.paper span{font-size:13px;color:var(--muted)}
.paper .best{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.paper .best.no{color:var(--muted);font-weight:500}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:16px 18px}
.row+.row{border-top:1px solid var(--line)}
.row .ic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink2)}
.row .tx{flex:1;min-width:0}
.row .nm{display:block;font-weight:700;font-size:16px}
.row .meta{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .mini{display:flex;height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:8px}
.row .mini i{height:100%}.row .mini .o{background:var(--ok)}.row .mini .x{background:var(--bad)}
.row .chev{color:var(--muted);font-size:20px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;border:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{background:var(--card);border:0;border-radius:20px;padding:18px;text-align:left;display:grid;gap:4px}
.qbtn b{font-size:16px;font-weight:700}
.qbtn span{font-size:13px;color:var(--muted)}
.qbtn:disabled{opacity:.4;cursor:default}
.foot{font-size:12.5px;color:var(--muted);margin:28px 4px 0;line-height:1.7}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:10px 4px;margin:-10px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;background:var(--card);border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.back{border:0;background:none;color:var(--ink2);font-size:15px;font-weight:600;padding:6px 0;margin-bottom:4px}

/* 퀴즈 */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.x-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--ink2)}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.count{font-size:14px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.count.timer{color:var(--ink)}.count.low{color:var(--bad)}
.quitmsg{font-size:13.5px;color:var(--bad);margin:-6px 0 10px;text-align:center;font-weight:600}
.secline{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;font-size:13.5px;color:var(--muted)}
.secline b{color:var(--accent);font-size:14.5px}
.qcard{background:var(--card);border-radius:24px;padding:24px 20px}
.qmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.qmeta .tag{background:var(--soft);border-radius:8px;padding:3px 9px;font-weight:600}
.qmeta .tag.hd{background:var(--bad-soft);color:var(--bad)}
.qmeta .tag.su{background:var(--accent-soft);color:var(--accent)}
.star{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--line);padding:2px 4px}
.star[aria-pressed="true"]{color:#ffc342}
.qtext{font-size:19px;font-weight:700;line-height:1.55;letter-spacing:-.02em;margin:0 0 18px;text-wrap:pretty}
.qno{color:var(--accent);margin-right:4px}
.case{background:var(--soft);border-radius:16px;padding:14px 16px;margin:0 0 16px;font-size:15px;line-height:1.75;color:var(--ink2)}
.box{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:20px 16px 14px;margin:10px 0 18px;font-size:15px;line-height:1.75;color:var(--ink2)}
.box .lbl{position:absolute;top:-.75em;left:16px;background:var(--card);padding:0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.box p{margin:0 0 4px;padding-left:1.4em;text-indent:-1.4em}.box p:last-child{margin:0}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:15px 16px;font-size:16px;line-height:1.55;transition:background .15s,border-color .15s}
.opt .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:-1px}
.opt .t{min-width:0}
.opt:disabled{cursor:default}
@media (hover:hover){.opt:not(:disabled):hover{background:var(--soft)}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
/* 해설 말풍선 */
.fb{margin-top:20px;display:grid;gap:8px}
.fb .v{justify-self:center;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:6px 16px;border-radius:999px}
.fb .v.ok{color:var(--ok);background:var(--ok-soft)}.fb .v.no{color:var(--bad);background:var(--bad-soft)}.fb .v.na{color:var(--muted);background:var(--soft)}
.fb .chat{display:flex;gap:10px;align-items:flex-start}
.fb .av{flex:0 0 auto;width:36px;height:36px;border-radius:14px;background:var(--warm);color:var(--warm-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.fb .bub{position:relative;background:var(--soft);border-radius:4px 18px 18px 18px;padding:12px 14px;min-width:0;flex:1}
.fb .who{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.fb .body{white-space:pre-line;font-size:15px;line-height:1.75}
.fb .ref{margin-top:8px;font-size:12.5px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 72%,transparent);padding-top:22px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:8px}
.dock .cta{flex:1}
.dock .side{flex:0 0 auto;width:auto;padding:17px 18px}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:8px}
.sheetgrid button{border:0;background:var(--soft);border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.sheetgrid button.m{background:var(--accent-soft);color:var(--accent)}
.sheetgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.omr-sub{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 0}.omr-sub:first-child{margin-top:0}

/* 결과 */
.result{background:var(--card);border-radius:24px;padding:30px 20px;text-align:center}
.eyebrow{font-size:13.5px;color:var(--muted);font-weight:600}
.result .sc{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.result .sc small{font-size:22px;font-weight:700;margin-left:2px}
.result p{color:var(--muted);margin:6px 0 0;font-size:14.5px}
.result .pass{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;border-radius:999px;padding:5px 14px}
.result .pass.ok{background:var(--ok-soft);color:var(--ok)}.result .pass.no{background:var(--bad-soft);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:13px 18px;text-align:right;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;color:var(--muted);font-weight:600;font-size:13px}
.tbl .sum td{font-weight:800}
.notes p{margin:0 0 10px;font-size:15px;line-height:1.7;color:var(--ink2)}.notes p:last-child{margin:0}
.rlist{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;overflow:hidden}
.rlist li+li{border-top:1px solid var(--line)}
.rlist summary{display:flex;gap:12px;padding:15px 18px;cursor:pointer;list-style:none;font-size:15px;align-items:flex-start}
.rlist summary::-webkit-details-marker{display:none}
.rlist .mk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.rlist .mk.o{background:var(--ok-soft);color:var(--ok)}.rlist .mk.x{background:var(--bad-soft);color:var(--bad)}
.rlist .qq{min-width:0;flex:1;line-height:1.5}
.rlist .qq small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.rlist .inner{padding:0 10px 14px}
.rlist .inner .qcard{padding:16px 8px 6px;border-radius:0}
.empty{background:var(--card);border-radius:20px;padding:36px 20px;text-align:center;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none!important}}
</style>

<style>
.daily{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:16px}
.goal{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:0 0 auto;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring b,.ring span{position:relative}
.ring b{font-size:20px;font-weight:800;line-height:1;margin-top:10px}
.ring span{font-size:11px;color:var(--muted);margin-top:-14px}
.ring{grid-template-rows:auto auto}
.gtx{display:grid;gap:2px;min-width:0}.gtx b{font-size:17px}.gtx span{font-size:13px;color:var(--muted)}
.why{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);display:grid;gap:6px}
.why li{display:flex;gap:8px;font-size:14px;line-height:1.6;color:var(--ink2)}
.why li b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11.5px;margin-top:2px}
.why li.a b{background:var(--ok);color:#fff}
.why li span{min-width:0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:2px}
.stat3 b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:10px;font-size:14px}
.bn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bt i.lo{background:var(--bad)}
.bv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:4.2em}
.bv small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.week{padding:20px 16px 14px}
.cols{position:relative;height:140px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;padding-bottom:22px}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col i{display:block;width:70%;max-width:28px;min-height:3px;background:var(--accent-soft);border-radius:6px 6px 2px 2px}
.col i.hit{background:var(--accent)}
.cv{font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.cl{position:absolute;bottom:-20px;font-size:12px;color:var(--muted)}
@media (max-width:360px){.bar{grid-template-columns:6em 1fr auto}}
</style>
<style>
.pred{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:0 12px;width:100%;border:0;background:var(--soft);border-radius:16px;padding:14px 16px;text-align:left}
.pred .pl{font-size:14px;font-weight:700}.pred .pl small{font-weight:500;color:var(--muted);margin-left:4px}
.pred .pv{grid-row:1/3;grid-column:2;font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pred .pv.na{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.pred .ps{font-size:13px;color:var(--muted)}
.hi{color:var(--ok)}.mid{color:#f59f00}.lo{color:var(--bad)}
.predbox .pbig{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.psub{margin:4px 0 0;color:var(--ink2);font-size:15px}
.predbox .tbl th,.predbox .tbl td{padding:10px 4px}
</style>
<style>
/* 앱 셸: 하단 탭바, 아이콘, 히어로 게이지, 모션 */
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"] .i{stroke-width:2.3}
.top-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 18px}
.top-h .title{margin:2px 0 0}
.eyebrow{font-size:14px;color:var(--accent);font-weight:700}
.dday{flex:0 0 auto;font-size:15px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:7px 13px;border-radius:999px;font-variant-numeric:tabular-nums}
.hero{background:var(--card);border-radius:28px;padding:22px 20px 20px;display:grid;gap:14px;justify-items:center;text-align:center}
.gauge{width:min(240px,72%);height:auto;overflow:visible}
.gauge path{fill:none;stroke-width:16;stroke-linecap:round}
